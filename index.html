  <!-- Apply the saved theme (or the system one) before first paint. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {

      }
      document.documentElement.setAttribute("data-theme", t);
    })();
